# シーケンス長16384用GRPO学習設定（QLoRA有効）

model:
  name: "unsloth/DeepSeek-R1-0528-Qwen3-8B"
  max_seq_length: 16384  # シーケンス長を16384に拡張
  load_in_4bit: true
  dtype: "float16"
  # QLoRA設定（VRAM削減）
  use_qlora: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
  lora_alpha: 16
  lora_dropout: 0.05
  bias: "none"
  use_gradient_checkpointing: true

grpo:
  num_generations_per_prompt: 2
  kl_penalty:
    beta: 0.05
  advantage:
    normalize: true
    whitening: true

training:
  output_dir: "./models/seq16384_qlora_checkpoint"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  warmup_steps: 5
  logging_steps: 1
  save_steps: 10
  eval_steps: 10
  max_steps: 10
  fp16: true
  optim: "adamw_8bit"
  gradient_checkpointing: true
  seed: 42

reward_function:
  weights:
    accuracy: 0.6
    format_correctness: 0.2
    reasoning_quality: 0.2
  thresholds:
    excellent_accuracy: 0.05
    good_accuracy: 0.15
    poor_accuracy: 0.30

data:
  train_file: "./data/grpo_processed/train.json"
  val_file: "./data/grpo_processed/val.json"
  test_split: 0.1
